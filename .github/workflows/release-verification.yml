name: Release verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-release:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete local release and Chromium integration
        run: ./script/verify_release.sh
      - name: Preserve actual verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.runner }}
          path: test-results/
          retention-days: 14
